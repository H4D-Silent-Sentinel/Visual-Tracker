<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>chaser-1 · phone link</title>
<style>
  :root { --bg:#0d1216; --panel:#141b21; --fg:#e4eaee; --muted:#8d9ba6; --line:#25313a; --ok:#3fb96b; --warn:#ff9f1c; --bad:#e5484d; --accent:#6ea8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { padding: max(14px, env(safe-area-inset-top)) 14px 24px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; aspect-ratio: 16/9; object-fit: cover; }
  button { font: inherit; font-weight: 700; width: 100%; padding: 14px; border-radius: 10px; border: 0; background: var(--accent); color: #0d1216; margin: 12px 0; }
  button.stop { background: var(--bad); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  details { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  summary { font-weight: 600; }
  label { display: block; margin-top: 10px; color: var(--muted); font-size: 14px; }
  input { font: inherit; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: #0d1216; color: var(--fg); margin-top: 4px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .row button { margin: 4px 0 0; padding: 9px; font-weight: 600; background: #25313a; color: var(--fg); }
  #msg { margin-top: 8px; font-size: 14px; }
  canvas { display: none; }
</style>
</head>
<body>
<main>
  <h1>chaser-1 · phone link</h1>
  <div class="sub">This phone plays the chaser drone's camera. It sends video, GPS and where it's pointing to the Visual-Tracker on the Mac. Hold it sideways, back camera toward the sky you're watching.</div>
  <video id="video" playsinline muted autoplay></video>
  <button id="go">Start</button>
  <div class="grid">
    <div class="card"><div class="k">Link to tracker</div><div class="v" id="link">off</div></div>
    <div class="card"><div class="k">GPS</div><div class="v" id="gps">—</div></div>
    <div class="card"><div class="k">Pointing</div><div class="v" id="hdg">—</div></div>
    <div class="card"><div class="k">Tilt</div><div class="v" id="tilt">—</div></div>
  </div>
  <div id="msg" class="warn" role="status" aria-live="polite"></div>
  <details>
    <summary>Compass correction</summary>
    <label>Correction added to the compass (°). Phones read magnetic north; New York is about −13°.
      <input id="corr" type="number" step="1" value="-13" inputmode="decimal"></label>
    <label>Or aim at something whose true bearing you know and enter it:
      <div class="row"><input id="known" type="number" step="1" placeholder="e.g. 90" inputmode="decimal"><button id="setk" type="button">Set</button></div></label>
  </details>
  <canvas id="cv"></canvas>
</main>
<script>
// Direction of the back camera from the W3C device-orientation angles.
// alphaAbs: rotation about the vertical, counterclockwise from north (absolute); beta, gamma in degrees.
// Returns {heading: clockwise from north, pitch: up +}. Device frame: x right, y top, z out of the screen;
// the back camera looks along -z. R = Rz(alpha) * Rx(beta) * Ry(gamma).
function boresight(alphaAbs, beta, gamma) {
  const r = Math.PI / 180, a = alphaAbs * r, b = beta * r, g = gamma * r;
  const x = -Math.sin(g), y = Math.cos(g) * Math.sin(b), z = -Math.cos(g) * Math.cos(b);
  const east = Math.cos(a) * x - Math.sin(a) * y, north = Math.sin(a) * x + Math.cos(a) * y;
  return {heading: (Math.atan2(east, north) / r + 360) % 360, pitch: Math.asin(Math.max(-1, Math.min(1, z))) / r};
}
if (typeof module !== 'undefined') { module.exports = {boresight}; }

if (typeof document !== 'undefined') {
const $ = id => document.getElementById(id);
let running = false, stream = null, wake = null, watch = null;
let pose = {}, raw = null, sent = 0, okAt = 0;
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
if (store.get('corr') !== null) $('corr').value = store.get('corr');
$('corr').onchange = () => store.set('corr', $('corr').value);
$('setk').onclick = () => {
  const k = parseFloat($('known').value);
  if (raw === null || isNaN(k)) { $('msg').textContent = 'Start first, then aim and enter the bearing.'; return; }
  const c = ((k - raw + 540) % 360) - 180;
  $('corr').value = c.toFixed(0); store.set('corr', $('corr').value);
  $('msg').textContent = `Correction set to ${c.toFixed(0)}°.`;
};

function onOrient(e) {
  let alphaAbs = null;
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) alphaAbs = 360 - e.webkitCompassHeading; // iOS
  else if (e.absolute && e.alpha !== null) alphaAbs = e.alpha; // Android (deviceorientationabsolute)
  if (alphaAbs === null || e.beta === null || e.gamma === null) return;
  const b = boresight(alphaAbs, e.beta, e.gamma);
  raw = b.heading;
  pose.heading = (b.heading + (parseFloat($('corr').value) || 0) + 360) % 360;
  pose.pitch = b.pitch;
  $('hdg').textContent = `${pose.heading.toFixed(0)}°`;
  $('tilt').textContent = `${pose.pitch >= 0 ? '+' : ''}${pose.pitch.toFixed(0)}°`;
}

async function start() {
  $('msg').textContent = '';
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('Compass access was refused. Allow Motion & Orientation for this site.');
    }
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}});
  } catch (e) {
    $('msg').className = 'bad';
    $('msg').textContent = (e && e.message) || String(e);
    return;
  }
  $('video').srcObject = stream;
  addEventListener('deviceorientationabsolute', onOrient);
  addEventListener('deviceorientation', onOrient);
  watch = navigator.geolocation.watchPosition(p => {
    Object.assign(pose, {lat: p.coords.latitude, lon: p.coords.longitude, alt_m: p.coords.altitude || 0, acc_m: p.coords.accuracy});
    const acc = p.coords.accuracy;
    $('gps').textContent = `±${acc.toFixed(0)} m`;
    $('gps').className = 'v ' + (acc <= 15 ? 'ok' : acc <= 40 ? 'warn' : 'bad');
  }, err => { $('gps').textContent = 'no fix'; $('gps').className = 'v bad'; $('msg').textContent = 'GPS: ' + err.message; },
     {enableHighAccuracy: true, maximumAge: 1000, timeout: 15000});
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  running = true;
  $('go').textContent = 'Stop'; $('go').className = 'stop';
  loop();
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (watch !== null) navigator.geolocation.clearWatch(watch);
  if (wake) wake.release().catch(() => {});
  removeEventListener('deviceorientation', onOrient);
  removeEventListener('deviceorientationabsolute', onOrient);
  $('go').textContent = 'Start'; $('go').className = '';
  $('link').textContent = 'off'; $('link').className = 'v';
}

async function loop() {
  const v = $('video'), cv = $('cv');
  while (running) {
    const t0 = performance.now();
    if (v.videoWidth) {
      const w = Math.min(960, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(v, 0, 0, w, h);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.7));
      try {
        const r = await fetch('/frame', {method: 'POST', body: blob, headers: {'Content-Type': 'image/jpeg', 'X-Pose': JSON.stringify(pose)}});
        if (r.ok) { sent++; okAt = Date.now(); }
      } catch (e) {}
    }
    const live = Date.now() - okAt < 2000;
    $('link').textContent = live ? `sending · ${sent}` : 'can’t reach Mac';
    $('link').className = 'v ' + (live ? 'ok' : 'bad');
    await new Promise(r => setTimeout(r, Math.max(0, 160 - (performance.now() - t0))));  // ~6 frames/s
  }
}

$('go').onclick = () => running ? stop() : start();
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
});
}
</script>
</body>
</html>
