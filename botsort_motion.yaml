# BoT-SORT with camera-motion compensation, for a MOVING camera (our chaser drone, a hand-held phone).
# Before matching, it estimates how the whole picture moved (sparse optical flow) and shifts its
# predicted drone positions by that much, so a pan does not look like the drone jumping.
# Same thresholds as our ByteTrack setup otherwise. Use: model.track(frame, tracker="botsort_motion.yaml")
tracker_type: botsort
track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.35
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
